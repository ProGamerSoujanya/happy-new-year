<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy New Year 2026!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: 'Pacifico', cursive;
      background: linear-gradient(135deg, #f5af19, #f12711);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: opacity 0.5s ease;
      z-index: 10;
    }

    .overlay h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .overlay button {
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #ffffff;
      color: #f12711;
      transition: transform 0.2s, background 0.2s;
    }

    .overlay button:hover {
      transform: scale(1.1);
      background: #ffeb3b;
    }

    .message {
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .message h1 { font-size: 4rem; margin-bottom: 20px; }
    .message p { font-size: 1.5rem; max-width: 700px; }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #fff;
      opacity: 0.7;
      pointer-events: none;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }

  </style>
</head>
<body>

  <!-- Overlay / Splash Screen -->
  <div class="overlay" id="splash">
    <h1>Welcome to 2026! 🎉</h1>
    <button onclick="showMessage()">Click Here for a Special Message</button>
  </div>

  <!-- Hidden Message -->
  <div class="message" id="message">
    <h1>Happy New Year 2026! 🥳</h1>
    <p>
      I want to take a moment to thank my family, friends, teachers, and everyone
      who has supported me. Your love and guidance mean the world to me. May this
      year bring happiness, success, and unforgettable memories for all of us!
    </p>
  </div>

  <script>
    function showMessage() {
      const splash = document.getElementById('splash');
      const message = document.getElementById('message');

      // Fade out splash
      splash.style.opacity = 0;
      setTimeout(() => {
        splash.style.display = 'none';
        message.style.display = 'flex';
        addConfetti(); // Start confetti
      }, 500);
    }

    function addConfetti() {
      for (let i = 0; i < 150; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 60%)`;
        confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
        confetti.style.width = confetti.style.height = (5 + Math.random() * 10) + 'px';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 5000);
      }
    }
  </script>

</body>
</html>
