<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy New Year!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(135deg, #f5af19, #f12711);
      font-family: 'Pacifico', cursive;
      overflow: hidden;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 4rem;
      margin: 0.5em 0;
    }

    p {
      font-size: 1.5rem;
      margin: 0.5em 0 2em 0;
    }

    .btn {
      padding: 10px 20px;
      font-size: 1.2rem;
      border: none;
      border-radius: 5px;
      background: #ffffff;
      color: #f12711;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      transform: scale(1.1);
      background: #ffeb3b;
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #fff;
      opacity: 0.7;
      pointer-events: none;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }
  </style>
</head>
<body>

  <h1>Happy New Year 2026! 🎉</h1>
  <p>Thank you to my family, friends, teachers, and everyone who supported me!</p>
  <button class="btn" onclick="addConfetti()">Spread Confetti 🎊</button>

  <script>
    function addConfetti() {
      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 60%)`;
        confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
        confetti.style.width = confetti.style.height = (5 + Math.random() * 10) + 'px';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 5000);
      }
    }

    // Auto-confetti on page load
    addConfetti();
  </script>

</body>
</html>
